<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>files test</title>
<style>
  body{background:#111;color:#eee;font:16px/1.6 -apple-system,sans-serif;padding:20px}
  a,button{display:block;margin:14px 0;padding:12px;font-size:16px}
  pre{color:#7CFC00;font:12px/1.3 monospace;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h3>文件测试页</h3>

<input type="file" id="f1">
<input type="file" id="f2" multiple>

<a href="/download/demo.bin" download>下载 http 文件（UTF-8 文件名）</a>
<a href="/download/zc.apk" download>下载 apk 文件</a>
<button id="blobbtn">下载 blob 文件（1.2MB，分块）</button>

<pre id="out"></pre>

<script>
function L(m) {
  var el = document.getElementById('out');
  el.textContent = m + '\n' + el.textContent;
  try { ZCReport.log('FILES ' + m); } catch (e) { }
}
function show(tag, files) {
  var parts = [];
  for (var i = 0; i < files.length; i++) parts.push(files[i].name + ':' + files[i].size);
  L(tag + ' picked ' + files.length + ' → ' + parts.join(', '));
  if (files.length) {
    var r = new FileReader();
    r.onload = function () { L('read first file ok, ' + r.result.length + ' chars'); };
    r.onerror = function () { L('read first file FAILED'); };
    r.readAsText(files[0]);
  }
}
document.getElementById('f1').addEventListener('change', function () { show('single', this.files); });
document.getElementById('f2').addEventListener('change', function () { show('multi', this.files); });

document.getElementById('blobbtn').addEventListener('click', function () {
  var body = 'blob-download-' + Date.now() + '\n';
  body += new Array(1200000).join('Z');
  var b = new Blob([body], { type: 'text/plain' });
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u;
  a.download = 'blob-fixed.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
  L('blob clicked');
});

L('files test page ready');
</script>
</body>
</html>
